<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<body>
    <div class="menu-buttons">
        <button type="button" class="collapse" onclick="collapseApp();">–</button>
        <button type="button" class="close" onclick="quitApp();">X</button>
    </div>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="container w-50">
            <h2 class="mb-5">Новый заказ</h2>
            <form method="post" class="mt-1">
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Имя</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="name" id="name">
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Телефон</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="telephone" id="telephone">
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Компания</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="company" id="company">
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Услуга</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="service" id="service">
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Тип авто</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="type" id="type">
                    </div>
                </div>
                <div class="row mb-2">
                    <label class="col-sm-3 col-form-label">Название авто</label>
                    <div class="col-sm-6">
                        <input type="text" class="form-control" name="avto" id="avto">
                    </div>
                </div>
                <div class="row mb-3 mt-3">
                    <div class="col-sm-5 d-grid">
                        <button onclick="addOrder()" class="btn btn-primary">Добавить</button>
                        <script src="sender/orders.js"></script>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <a class="btn btn-outline-primary" href="main.html" role="button">Выйти</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <style>
        body {
            background-image: linear-gradient(#f2f3f5, 60%, #8fa3c2);
            margin: 0;
            overflow: hidden;
        }

        .menu-buttons {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            text-align: right;
        }

        .menu-buttons button {
            background: #f2f3f5;
            border: none;
            font-size: 17px;
            padding: 3px 15px;
            transition: .3s;
            color: #8fa3c2;
            margin: 0;
        }

        .menu-buttons button:hover {
            background: #8fa3c2;
            color: #f2f3f5;
        }
    </style>

    <script>
        const { ipcRenderer } = require('electron');

        function quitApp() {
            ipcRenderer.send('quit-app');
        }

        function collapseApp() {
            ipcRenderer.send('minimize-window');
        }

    </script>
</body>
