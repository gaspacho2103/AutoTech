<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<body>
    <div class="menu-buttons">
        <button type="button" class="collapse" onclick="collapseApp();">–</button>
        <button type="button" class="close" onclick="quitApp();">X</button>
    </div>
    <main class="main">
        <div class="side-bar">
            <button class="side-button"><img src="assets/message.png" onclick="ordersOpen();" class="side-button-img"></button>
            <button class="side-button"><img src="assets/phone.png" onclick="contactsOpen();" class="side-button-img"></button>
            <button class="side-button"><img src="assets/rating.png" onclick="reviewsOpen();" class="side-button-img"></button>
            <button class="side-button"><img src="assets/exit.png" onclick="exitApp();" class="side-button-img"></button>
        </div>
        <div class="content">
            <div class="container">
                <h3 class='tableTitle'>Контакты компании</h3>
                                                <br><table class='table'>
                                                    <thead>
                                                        <tr>
                                                            <th>Телефон</th>
                                                            <th>Telegram</th>
                                                            <th>Email</th>
                                                            <th>Адрес</th>
                                                            <th>Действие</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <script src='sender/contacts.js'></script>
                                                    </tbody>
                                                    
                                                </table>
            </div>
        </div>
    </main>

    <style>
        body {
            background-image: linear-gradient(#f2f3f5, 60%, #8fa3c2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95vh;
        }

        .menu-buttons {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            text-align: right;
        }

        .menu-buttons button {
            background: #f2f3f5;
            border: none;
            
            font-size: 17px;
            padding: 3px 15px;

            transition: .3s;

            color: #8fa3c2;

            margin: 0;

        }

        .menu-buttons button:hover {
            background: #8fa3c2;
            color: #f2f3f5;
        }

        .main {
            width: 100%;

            display: flex;
        }

        .side-bar {
            width: 10%;

            padding: 7px;
            
        }

        .content {
            width: 90%;
        }
        table {
            background: transparent;
        }

        tbody {
            border-radius: 12px;

            background: transparent;
        }

        th {
            font-size: 15px;
        }

        td {
            font-size: 15px;
        }

        .btn {
            font-size: 12px;
        }

        .btn + .btn {
            margin-top: 5px;
        }

        .side-button {
            display: block;
            border-radius: 10px;
            background: transparent;

            padding: 7px;

            border: 1px solid #8fa3c2;

            transition: .3s;
        }

        .side-button:hover {
            background: #8fa3c2;
        }

        .side-button + .side-button {
            margin-top: 35px;
        }

        .side-button-img {
            width: 40px;
            height: 40px;
        }
    </style>

<script>
    const { ipcRenderer } = require('electron');

    function quitApp() {
        ipcRenderer.send('quit-app');
    }

    function collapseApp() {
        ipcRenderer.send('minimize-window');
    }

    function ordersOpen() {
        ipcRenderer.send('load-new-page', 'src/main.html');
    }

    function reviewsOpen() {
        ipcRenderer.send('load-new-page', 'src/reviews.html');
    }

    function contactsOpen() {
        ipcRenderer.send('load-new-page', 'src/contacts.html');
    }

    function exitApp() {
        ipcRenderer.send('load-new-page', 'src/index.html');
    }
</script>
</body>
