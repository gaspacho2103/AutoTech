<body>
    <div class="menu-buttons">
        <button type="button" class="collapse" onclick="collapseApp();">–</button>
        <button type="button" class="close" onclick="quitApp();">X</button>
    </div>
    <form class="authorize" action="" method="post">
        <h2 class="auth__title">Панель администратора</h2>
        <div class="form__group">
            <input class="form__input" type="text" name="login" id="login" placeholder=" ">
            <label class="form__label">Введите логин</label>
        </div>
        <div class="form__group">
            <input class="form__input" type="text" name="password" id="password" placeholder=" ">
            <label class="form__label">Введите пароль</label>
        </div>
        <button type="button" class="authButton" onclick="securityAuth();">Войти</button><br />
    </form>

    <style>
        body {
            background-image: linear-gradient(#f2f3f5, 60%, #8fa3c2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95vh;
        }

        .menu-buttons {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 10;
            text-align: right;
        }

        .menu-buttons button {
            background: #f2f3f5;
            border: none;
            
            font-size: 17px;
            padding: 3px 15px;

            transition: .3s;

            color: #8fa3c2;

            margin: 0;

        }

        .menu-buttons button:hover {
            background: #8fa3c2;
            color: #f2f3f5;
        }

        .authorize {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 16px #8fa3c2;
            font-family: sans-serif;
            letter-spacing: 1px;
            
            width: 50%;
            height: 60vh;
        }

        .form__input,
        .authButton {
            font-family: sans-serif;
            letter-spacing: 1px;
            font-size: 16px;
        }

        .auth__title {
            text-align: center;
            margin: 0 0 55px 0;
            font-weight: bold;
            font-size: 28px;
            color: #333;
        }

        .form__group {
            position: relative;
            margin-bottom: 50px;
        }

        .form__label {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            color: #9e9e9e;
            pointer-events: none;
            transition: .3s;
        }

        .form__input {
            width: 100%;
            padding: 0 0 10px 0;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            background-color: transparent;
            outline: none;
            transition: .3s;
        }

        .form__input:focus {
            border-bottom: 1px solid #8fa3c2;
        }

        .authButton {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: #fff;
            background: #8fa3c2;
            outline: none;
            cursor: pointer;
            transition: .3s;
            margin: 0 0 25px 0;

            width: 100%;
        }

        .authButton:focus,
        .authButton:hover {
            background-color: #a7bddf;
        }

        .form__input:focus ~ .form__label,
        .form__input:not(:placeholder-shown) ~ .form__label {
            top: -18px;
            font-size: 12px;
            color: #e0e0e0;
        }
    </style>

    <script>
        const { ipcRenderer } = require('electron');

        function quitApp() {
            ipcRenderer.send('quit-app');
        }

        function collapseApp() {
            ipcRenderer.send('minimize-window');
        }
       
    </script>

    <script src="sender/authorize.js"></script>
   
</body>
